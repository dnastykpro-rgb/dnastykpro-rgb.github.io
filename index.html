<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonVisuals — Minecraft 1.21.4</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(-45deg, #090612, #1b0c36, #2d114d, #0f172a);
            background-size: 400% 400%;
            animation: grad 14s ease infinite;
            color: #f3f0fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        @keyframes grad { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes popIn { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

        .top-bar { width: 100%; max-width: 900px; padding: 18px 20px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .user-pill { display: flex; align-items: center; gap: 8px; background: rgba(20,14,38,0.8); border: 1px solid rgba(192,132,252,0.35); padding: 7px 15px; border-radius: 99px; font-size: 0.9rem; }
        .badge { padding: 3px 9px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; }
        .r-owner { background: #d97706; color: #fff; }
        .r-vip { background: #9333ea; color: #fff; }
        .r-user { background: rgba(148,163,184,0.25); color: #cbd5e1; }

        .btn-s { background: rgba(168,85,247,0.2); border: 1px solid rgba(192,132,252,0.4); color: #f3e8ff; padding: 8px 15px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.25s; font-family: inherit; }
        .btn-s:hover { background: rgba(168,85,247,0.45); transform: translateY(-2px); }
        .btn-owner { background: rgba(245,158,11,0.22); border: 1px solid rgba(251,191,36,0.6); color: #fde68a; }
        .btn-owner:hover { background: rgba(245,158,11,0.45); }

        header { text-align: center; padding: 25px 20px 15px; animation: fadeUp 0.9s ease forwards; }
        .ver { display: inline-block; padding: 5px 16px; margin-bottom: 12px; border-radius: 99px; background: rgba(168,85,247,0.15); border: 1px solid rgba(192,132,252,0.4); color: #e9d5ff; font-size: 0.85rem; font-weight: 600; }
        .logo { font-family: 'Cinzel Decorative', serif; font-size: clamp(2.5rem, 7vw, 4.6rem); background: linear-gradient(135deg, #f5d0fe, #c084fc, #7e22ce); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 25px rgba(192,132,252,0.45)); animation: float 5s ease-in-out infinite; margin-bottom: 8px; }
        .sub { color: #cbd5e1; font-size: 1.05rem; }

        .wrap { width: 100%; max-width: 620px; padding: 20px; animation: fadeUp 0.9s ease 0.2s forwards; opacity: 0; }
        .card { background: rgba(20,14,38,0.65); border: 1px solid rgba(192,132,252,0.3); border-radius: 24px; padding: 24px; backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0,0,0,0.45); transition: 0.35s; }
        .card:hover { transform: translateY(-5px); border-color: rgba(216,180,254,0.65); }

        .preview { width: 100%; height: 200px; border-radius: 14px; background: linear-gradient(135deg, rgba(46,16,101,0.7), rgba(15,23,42,0.9)); display: flex; align-items: center; justify-content: center; color: #a78bfa; margin-bottom: 18px; overflow: hidden; border: 1px solid rgba(167,139,250,0.2); }
        .preview img { width: 100%; height: 100%; object-fit: cover; }

        .c-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .c-head h2 { font-size: 1.6rem; font-weight: 800; }
        .tag { font-size: 0.8rem; font-weight: 600; padding: 5px 12px; border-radius: 8px; background: rgba(168,85,247,0.2); border: 1px solid rgba(192,132,252,0.35); color: #e9d5ff; }
        .desc { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }

        .btn-main { display: inline-block; padding: 14px 34px; background: linear-gradient(90deg, #9333ea, #6b21a8); color: #fff; text-decoration: none; font-weight: 800; border-radius: 12px; border: 1px solid rgba(216,180,254,0.45); box-shadow: 0 8px 25px rgba(147,51,234,0.45); cursor: pointer; transition: 0.3s; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(168,85,247,0.7); }

        .lock { background: rgba(15,23,42,0.75); border: 1px dashed rgba(192,132,252,0.4); padding: 16px; border-radius: 14px; text-align: center; }
        .lock p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px; }
        .k-row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
        input { background: rgba(9,6,18,0.85); border: 1px solid rgba(192,132,252,0.35); color: #fff; padding: 10px 14px; border-radius: 10px; outline: none; font-family: inherit; }

        .modal-bg { position: fixed; inset: 0; background: rgba(5,3,12,0.82); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
        .modal { background: #140e26; border: 1px solid rgba(192,132,252,0.4); border-radius: 22px; padding: 26px; width: 100%; max-width: 380px; animation: popIn 0.25s ease; }
        .owner-page { max-width: 480px; border-color: rgba(251,191,36,0.55); box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
        .op-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid rgba(251,191,36,0.25); }
        .op-head h3 { color: #fbbf24; font-size: 1.25rem; }
        .op-sec { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .op-sec:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
        .op-lbl { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 8px; display: block; font-weight: 600; }
        .keys { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .k-chip { background: rgba(0,0,0,0.5); border: 1px solid rgba(251,191,36,0.45); padding: 6px 11px; border-radius: 8px; font-family: monospace; color: #fde68a; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .k-chip:hover { background: rgba(251,191,36,0.2); }
        .op-row { display: flex; gap: 8px; }
        .op-row input { flex: 1; padding: 9px 12px; font-size: 0.88rem; }

        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(192,132,252,0.3); background: transparent; color: #cbd5e1; cursor: pointer; font-weight: 600; }
        .tab.act { background: #7e22ce; color: #fff; }
        .modal form { display: flex; flex-direction: column; gap: 10px; }
        footer { margin-top: auto; padding: 20px; font-size: 0.85rem; color: #8b80a8; }
    </style>
</head>
